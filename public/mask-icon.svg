<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Yoga pose silhouette (Tree pose - Vrksasana) -->
  <g fill="#000">
    <!-- Head -->
    <circle cx="50" cy="20" r="8"/>
    <!-- Body -->
    <path d="M50 28 L50 55 Q50 60 50 68" stroke="#000" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Arms raised -->
    <path d="M30 38 Q42 25 50 22 Q58 25 70 38" stroke="#000" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Standing leg -->
    <path d="M50 68 L50 90" stroke="#000" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Bent leg -->
    <path d="M50 55 Q65 50 58 68" stroke="#000" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
